[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careerpilot-sdk"
version = "0.1.0"
description = "Official Python SDK for CareerPilot"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["careerpilot_sdk"]

