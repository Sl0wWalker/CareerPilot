name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e "./apps/api[dev]"
      - run: npm ci
        working-directory: apps/web
      - run: ruff check apps/api
      - run: pytest apps/api
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: npm run lint
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - name: Package source and web build
        shell: bash
        run: |
          tar -czf careerpilot-${GITHUB_REF_NAME}-source.tar.gz --exclude=.git .
          (cd apps/web/dist && zip -r ../../../careerpilot-${GITHUB_REF_NAME}-web.zip .)
          sha256sum careerpilot-${GITHUB_REF_NAME}-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            careerpilot-*-source.tar.gz
            careerpilot-*-web.zip
            SHA256SUMS

